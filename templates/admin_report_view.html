<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Monatsreport {{ report.year }}-{{ '%02d' % report.month }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <!-- Überlagerung zur Abdunklung des Hintergrundbilds -->
    <div class="overlay"></div>

    <!-- Hauptinhalt für die Detailansicht eines Monatsreports -->
    <div class="content">
        <!-- Überschrift mit Jahr und Monat -->
        <h1>Monatsreport {{ report.year }}-{{ '%02d' % report.month }}</h1>

        <!-- Navigation zurück zu Reportliste und Adminbereich -->
        <p>
            <a href="{{ url_for('admin_reports_list') }}" class="back-link">Zurück zur Reportliste</a>
            &nbsp;|&nbsp;
            <a href="{{ url_for('admin_panel') }}" class="back-link">Zurück zum Adminbereich</a>
        </p>

        <!-- Tabelle mit allen Nutzer-Gesamtstunden für diesen Monat -->
        <table>
            <tr><th>User-ID</th><th>Name</th><th>Gesamtstunden</th></tr>
            {% for uid, data in report.users.items() %}
                <tr>
                    <td>{{ uid }}</td>
                    <td>{{ data.name }}</td>
                    <td>{{ data.total_hm }}</td>
                </tr>
            {% endfor %}
        </table>
    </div>
</body>
</html>
