<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – Zeiterfassung</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <!-- Hintergrundbild -->
    <img class="background" src="{{ url_for('static', filename='background.png') }}" alt="Hintergrund">

    <!-- Seitenüberschrift -->
    <h1 class="login">Login</h1>

    <!-- Bereich für Fehlermeldungen -->
    <div class="error">
        {% if error %}
        <p>{{ error }}</p>
        {% endif %}
    </div>

    <!-- Login-Formular -->
    <div class="Tabelle">
        <form method="POST">
            <label for="username">Benutzername (Vorname Nachname):</label>
            <input class="Feld" id="username" type="text" name="username" required>

            <label for="password">Passwort:</label>
            <input class="Feld" id="password" type="password" name="password" required>

            <button class="Anmelden" type="submit">Anmelden</button>
        </form>
    </div>
</body>
</html>
