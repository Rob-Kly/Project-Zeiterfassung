<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Passwort ändern – Zeiterfassung</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <!-- Hintergrundbild -->
    <img class="background" src="{{ url_for('static', filename='background.png') }}" alt="Hintergrund">

    <!-- Seitenüberschrift -->
    <h1 class="login">Neues Passwort vergeben</h1>

    <!-- Bereich für Fehlermeldungen -->
    <div class="error">
        {% if error %}
        <p>{{ error }}</p>
        {% endif %}
    </div>

    <!-- Formular zur Vergabe eines neuen Passworts -->
    <div class="Tabelle">
        <p>
            Das aktuelle Passwort wurde durch eine Administratorin oder einen Administrator gesetzt.
            Hier kann ein eigenes Passwort vergeben werden.
        </p>
        <form method="POST">
            <label for="new_password">Neues Passwort:</label>
            <input class="Feld" id="new_password" type="password" name="new_password" required>

            <label for="new_password_repeat">Neues Passwort wiederholen:</label>
            <input class="Feld" id="new_password_repeat" type="password" name="new_password_repeat" required>

            <button class="Anmelden" type="submit">Passwort speichern</button>
        </form>
    </div>
</body>
</html>
